<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jhonny Drone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:#000;
    z-index:1000;
}

.logo img{
    width:120px;
    height:120px;
    object-fit:cover;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

nav a:hover{
    color:#ff8800;
}

.hero{
    position:relative;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.hero-img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.overlay{
    position:relative;
    z-index:2;
    background:rgba(0,0,0,.35);
    padding:40px;
    text-align:center;
}

.hero h1{
    font-size:72px;
}

.hero p{
    font-size:24px;
    margin-top:15px;
}

.btn{
    margin-top:30px;
    display:inline-block;
    background:#ff8800;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:5px;
}
</style>

</head>

<body>

<header>
    <div class="logo">
        <img src="https://cdn.discordapp.com/attachments/1511944810561278022/1511945249897971772/image.png?ex=6a224c3e&is=6a20fabe&hm=3786648e5163b1dce33beb6b4698c89339771ede7df62584d9473a08c91a7873&" alt="Logo">
    </div>

```
<nav>
    <a href="#">Home</a>
    <a href="#">Serviços</a>
    <a href="#">Equipamentos</a>
    <a href="#">Portfólio</a>
    <a href="#">Avaliações</a>
    <a href="#">Sobre Mim</a>
    <a href="#">Contato</a>
</nav>
```

</header>

<section class="hero">

    <img class="hero-img"
    src="https://cdn.discordapp.com/attachments/1511944810561278022/1511945329644142712/upscalemedia-transformed2.png">

    <div class="overlay">
        <h1>JHONNY DRONE</h1>
        <p>Filmagens aéreas profissionais</p>
        <a href="#" class="btn">Solicitar orçamento</a>
    </div>

</section>

</body>
</html>
