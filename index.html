<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jhonny Drone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    z-index:10;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

nav a:hover{
    color:#ff8800;
}

.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1473968512647-3e447244af8f');
    background-size:cover;
    background-position:center;
}

.overlay{
    height:100%;
    background:rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:72px;
}

.hero p{
    font-size:24px;
    margin-top:15px;
}

.btn{
    margin-top:30px;
    display:inline-block;
    background:#ff8800;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:5px;
}
</style>

</head>

<body>

<header>
    <div class="logo">JHONNY DRONE</div>

```
<nav>
    <a href="#">Home</a>
    <a href="#">Serviços</a>
    <a href="#">Equipamentos</a>
    <a href="#">Portfólio</a>
    <a href="#">Avaliações</a>
    <a href="#">Sobre Mim</a>
    <a href="#">Contato</a>
</nav>
```

</header>

<section class="hero">
    <div class="overlay">
        <h1>JHONNY DRONE</h1>
        <p>Filmagens aéreas profissionais</p>
        <a href="#" class="btn">Solicitar orçamento</a>
    </div>
</section>

</body>
</html>
